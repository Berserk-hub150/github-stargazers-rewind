name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: checkboxes
    id: accuracy
    attributes:
      label: Accuracy model
      options:
        - label: This proposal preserves the distinction between historical reconstruction and exact live stargazer membership.
          required: true
